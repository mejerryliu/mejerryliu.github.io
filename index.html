<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noarchive">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <div class="blob" id="blob" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#top" id="brand"></a>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ja">日本語</button>
    </div>
  </header>

  <main id="top">
    <section class="hero" id="hero">
      <div class="stack" id="hero-stack" aria-hidden="true"></div>
      <div class="hero-copy">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 id="hero-title"></h1>
        <p class="lede" id="hero-lede"></p>
        <div class="actions" id="hero-actions"></div>
      </div>
    </section>

    <section class="panel" id="work">
      <h2 id="work-title"></h2>
      <div class="panel-body" id="work-list"></div>
    </section>

    <section class="panel dark" id="approach">
      <h2 id="approach-title"></h2>
      <ol class="panel-body steps" id="approach-list"></ol>
    </section>

    <section class="panel" id="experience">
      <h2 id="experience-title"></h2>
      <div class="panel-body" id="experience-list"></div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
